[project]
name = "spectral-knowledge-transfer-reproduction"
version = "0.1.0"
description = "Claim-by-claim reproduction of arXiv:2606.01292"
requires-python = "==3.12.*"
dependencies = [
  "datasets==4.4.1",
  "huggingface-hub==1.1.5",
  "marimo==0.17.7",
  "matplotlib==3.10.7",
  "numpy==2.3.5",
  "pandas==2.3.3",
  "pytest==9.0.2",
  "scikit-learn==1.7.2",
  "torch==2.7.1",
  "torchvision==0.22.1",
]

[tool.pytest.ini_options]
testpaths = ["repro/tests"]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", marker = "sys_platform != 'darwin'" },
]
torchvision = [
  { index = "pytorch-cpu", marker = "sys_platform != 'darwin'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
